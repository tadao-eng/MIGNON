[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haiku-checker"
version = "0.1.0"
description = "自作俳句の推敲・評価・類句チェックを行うコマンドラインツール"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# 形態素解析による読み推定。純 Python・辞書同梱でオフライン動作する。
reading = ["janome>=0.5"]
# 自前ホストの Web アプリ（haiku serve）
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
haiku = "haiku_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haiku_checker = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
